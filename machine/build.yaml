image: ghcr.io/smart-building-manager/{machine}-my-smart-homes
build_from:
  aarch64: "ghcr.io/my-smart-homes/aarch64-my-smart-homes:latest"
  armv7: "ghcr.io/my-smart-homes/armv7-my-smart-homes:latest"
  armhf: "ghcr.io/my-smart-homes/armhf-my-smart-homes:latest"
  amd64: "ghcr.io/my-smart-homes/amd64-my-smart-homes:latest"
  i386: "ghcr.io/my-smart-homes/i386-my-smart-homes:latest"
codenotary:
  signer: notary@smart-building-manager.io
  base_image: notary@smart-building-manager.io
cosign:
  base_identity: https://github.com/smart-building-manager/core/.*
  identity: https://github.com/smart-building-manager/core/.*
labels:
  io.hass.type: core
  org.opencontainers.image.source: https://github.com/smart-building-manager/core
